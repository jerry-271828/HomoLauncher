name: Build HAP (nightly)

on:
  push:
    branches: [master]
    # 版本标签（如 1.3.0）推送时发布正式 Release；标签推送不评估 paths 过滤器
    tags: ['*.*.*']
    paths:
      - 'AppScope/**'
      - 'entry/**'
      - 'libs/**'
      - 'xb_components'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'oh-package-lock.json5'
      - 'hvigor/**'
      - 'scripts/**'
      - '.gitmodules'
      - '.github/workflows/build-hap.yml'
  workflow_dispatch:

env:
  CLT_BASE_URL: https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461
  CLT_SHA256: b046da0a1a06fe13b3d82d198738abc54788d79c6c9d07c36617ec7fc31a3b3b

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download HarmonyOS command-line-tools
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "$CLT_BASE_URL/clt.zip.part00" -O "$CLT_BASE_URL/clt.zip.part01"
          cat clt.zip.part00 clt.zip.part01 > clt.zip
          rm -f clt.zip.part00 clt.zip.part01
          echo "$CLT_SHA256  clt.zip" | sha256sum -c
          unzip -q clt.zip -d "$HOME"
          rm -f clt.zip

      - name: Set up build environment
        run: |
          CLT="$HOME/command-line-tools"
          echo "$CLT/bin" >> "$GITHUB_PATH"
          echo "$CLT/tool/node/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$CLT/sdk" >> "$GITHUB_ENV"

      # CLT v26 内嵌 hvigor 仅支持 modelVersion 5.0.0，仓库内固定为 6.0.2（DevEco 6.0.2），CI 侧降级后再构建。
      - name: Downgrade hvigor modelVersion for CLT
        run: |
          sed -i 's/"modelVersion": *"6\.0\.2"/"modelVersion": "5.0.0"/' hvigor/hvigor-config.json5 oh-package.json5
          grep -H modelVersion hvigor/hvigor-config.json5 oh-package.json5

      # versionCode 只取决于源码提交：同一提交由 branch/tag/rerun 构建时必须完全一致，
      # 否则混用同一源码的 HAP/HSP 也会被系统误判为模块降级。
      - name: Bump versionCode for this build
        id: version
        run: |
          commitCount=$(git rev-list --count HEAD)
          newCode=$((1030100 + commitCount))
          sed -i "s/\"versionCode\": *[0-9]*/\"versionCode\": ${newCode}/" AppScope/app.json5
          grep -H versionCode AppScope/app.json5
          echo "code=${newCode}" >> "$GITHUB_OUTPUT"

      - name: ohpm install
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Verify patched LWJGL runtime
        run: python3 scripts/patch-lwjgl-runtime.py --check

      # fs-verity 会直接拒绝未补签的原生库，Java 侧只得到 error=null，表现为进入游戏后黑屏退出。
      - name: Verify signed native runtime source
        run: sh scripts/verify-native-runtime.sh libs/launcher.har

      # 仓库配置必须保持可移植；个人证书与绝对路径只能留在本机。
      - name: Verify portable project configuration
        run: |
          if ! grep -Eq '"signingConfigs"[[:space:]]*:[[:space:]]*\[\]' build-profile.json5; then
            echo "build-profile.json5 must use an empty signingConfigs array"
            exit 1
          fi
          if grep -Eq '(/Users/|/storage/Users/|[A-Za-z]:\\\\)' build-profile.json5; then
            echo "build-profile.json5 contains a machine-specific absolute path"
            exit 1
          fi
          if grep -Eq '"signingConfig"[[:space:]]*:' build-profile.json5; then
            echo "build-profile.json5 must not select a local signing config"
            exit 1
          fi

      - name: Build HAP (release, unsigned)
        run: hvigorw --mode module -p product=default -p buildMode=release assembleHap --no-daemon

      # JRE 以动态 HSP 形式按需安装，与 HAP 同版本号，一并产出避免版本错配
      - name: Build HSPs (release, unsigned)
        run: |
          hvigorw --mode module -p module=jre25@default -p product=default -p buildMode=release assembleHsp --no-daemon
          hvigorw --mode module -p module=jre17@default -p product=default -p buildMode=release assembleHsp --no-daemon

      - name: Locate artifacts
        run: |
          find entry/build -name '*.hap' -print
          find libs/*/build -name '*.hsp' -print

      # 同时比对 HAR 与最终 HSP，防止 ohpm/Hvigor 的 file: 依赖缓存把旧 .so 打进发布包。
      - name: Verify packaged native runtime
        run: |
          mapfile -t hsps < <(find libs/jre17/build libs/jre25/build -name '*.hsp' -type f -print)
          if [ ${#hsps[@]} -eq 0 ]; then echo "no .hsp found"; exit 1; fi
          sh scripts/verify-native-runtime.sh libs/launcher.har "${hsps[@]}"

      # 包管理器要求同一 Bundle 的所有模块使用相同 bundleName/versionCode。
      # 直接检查最终产物，防止出现 HAP 可装但后装 HSP 被判定为降级的发布包。
      - name: Verify HAP/HSP bundle identity
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          haps=(entry/build/default/outputs/default/*.hap)
          jre17s=(libs/jre17/build/default/outputs/default/*.hsp)
          jre25s=(libs/jre25/build/default/outputs/default/*.hsp)
          if [ ${#haps[@]} -ne 1 ] || [ ${#jre17s[@]} -ne 1 ] || [ ${#jre25s[@]} -ne 1 ]; then
            echo "expected exactly one entry HAP, jre17 HSP and jre25 HSP"
            exit 1
          fi

          for pkg in "${haps[0]}" "${jre17s[0]}" "${jre25s[0]}"; do
            metadata="$RUNNER_TEMP/$(basename "$pkg").module.json"
            unzip -p "$pkg" module.json > "$metadata"
            read -r bundleName versionCode moduleName < <(
              node - "$metadata" <<'NODE'
          const fs = require('fs');
          const metadata = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`${metadata.app.bundleName} ${metadata.app.versionCode} ${metadata.module.name}\n`);
          NODE
            )
            echo "$(basename "$pkg"): bundleName=$bundleName versionCode=$versionCode module=$moduleName"
            if [ "$bundleName" != "org.xbstudio.homl" ] || [ "$versionCode" != "$EXPECTED_VERSION_CODE" ]; then
              echo "bundle identity mismatch in $pkg"
              exit 1
            fi
          done

      # 小白调试助手 3.1 的 resources.index 解析器不能处理零长度资源值。
      # 发布前使用 SDK 自带 restool 检查，避免生成选择文件时即抛 RangeError 的 HAP。
      - name: Verify installer-compatible resources
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          haps=(entry/build/default/outputs/default/*.hap)
          if [ ${#haps[@]} -eq 0 ]; then echo "no .hap found"; exit 1; fi

          restool_path=$(find -L "$DEVECO_SDK_HOME" -type f -path '*/toolchains/restool' -print -quit)
          if [ -z "$restool_path" ]; then echo "restool not found"; exit 1; fi

          for hap in "${haps[@]}"; do
            dump_file="$RUNNER_TEMP/$(basename "$hap").resources.json"
            "$restool_path" dump "$hap" > "$dump_file"
            node - "$dump_file" "$hap" <<'NODE'
          const fs = require('fs');
          const dumpPath = process.argv[2];
          const hapPath = process.argv[3];
          const document = JSON.parse(fs.readFileSync(dumpPath, 'utf8'));
          const emptyResources = [];

          for (const resource of document.resource ?? []) {
            for (const entry of resource.entryValues ?? []) {
              if (entry.value === '') {
                emptyResources.push(`${resource.type}:${resource.name}`);
              }
            }
          }

          if (emptyResources.length > 0) {
            console.error(`${hapPath} contains zero-length resources: ${emptyResources.join(', ')}`);
            process.exit(1);
          }
          NODE
          done

      # 每个 ZIP 只包含同一次构建、同一 versionCode 的 HAP 与一个 JRE HSP，
      # 避免从正式版和 Nightly 混拿模块。安装器不支持批量时，也可从同一 ZIP 依次装 HAP、HSP。
      - name: Prepare matched install sets
        id: install_sets
        env:
          BUILD_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          haps=(entry/build/default/outputs/default/*.hap)
          if [ ${#haps[@]} -ne 1 ]; then echo "expected exactly one .hap"; exit 1; fi

          ver=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' AppScope/app.json5)
          sha7=${GITHUB_SHA::7}
          outputDir="$RUNNER_TEMP/homl-install-sets"
          mkdir -p "$outputDir"

          for jre in jre17 jre25; do
            hsps=(libs/$jre/build/default/outputs/default/*.hsp)
            if [ ${#hsps[@]} -ne 1 ]; then echo "expected exactly one $jre .hsp"; exit 1; fi

            pairDir="$RUNNER_TEMP/homl-$jre-pair"
            mkdir -p "$pairDir"
            hapName="entry-${ver}-vc${BUILD_VERSION_CODE}-${sha7}.hap"
            hspName="${jre}-${ver}-vc${BUILD_VERSION_CODE}-${sha7}.hsp"
            cp "${haps[0]}" "$pairDir/$hapName"
            cp "${hsps[0]}" "$pairDir/$hspName"
            cat > "$pairDir/INSTALL.txt" <<EOF
          HomoLauncher matched install set
          commit: $GITHUB_SHA
          versionName: $ver
          versionCode: $BUILD_VERSION_CODE
          runtime: $jre

          Sign both files with the same certificate. Install them together when possible.
          If the installer only accepts one file at a time, install the HAP and then the HSP
          from this directory; never mix either file with another Release or Nightly build.
          EOF
            (
              cd "$pairDir"
              zip -q "$outputDir/HomoLauncher-${jre}-${ver}-vc${BUILD_VERSION_CODE}-${sha7}.zip" \
                "$hapName" "$hspName" INSTALL.txt
            )
          done

          echo "dir=$outputDir" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: homl-hap
          path: |
            entry/build/default/outputs/default/*.hap
            libs/*/build/default/outputs/default/*.hsp
          if-no-files-found: error

      - name: Publish nightly release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION_CODE: ${{ steps.version.outputs.code }}
          INSTALL_SET_DIR: ${{ steps.install_sets.outputs.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(entry/build/default/outputs/default/*.hap libs/*/build/default/outputs/default/*.hsp)
          if [ ${#pkgs[@]} -eq 0 ]; then echo "no .hap/.hsp found"; exit 1; fi

          ver=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' AppScope/app.json5)
          sha7=${GITHUB_SHA::7}

          assets=()
          for h in "${pkgs[@]}"; do
            base=$(basename "$h")
            dst="$RUNNER_TEMP/${base%.*}-${ver}-vc${BUILD_VERSION_CODE}-${sha7}.${base##*.}"
            cp "$h" "$dst"
            assets+=("$dst")
          done
          for archive in "$INSTALL_SET_DIR"/*.zip; do
            assets+=("$archive")
          done

          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly ${ver} (${sha7})" \
            --prerelease \
            --notes "自动构建的**未签名** HAP/HSP（versionName ${ver}，versionCode ${BUILD_VERSION_CODE}，commit \`${sha7}\`）。请下载对应 JRE 的成对 ZIP，用同一证书/Profile 签名后按 **HAP → HSP** 顺序安装；不要混用其他构建的模块。"

      # 推送版本标签（如 1.3.0）时发布正式 Release，标签须与 versionName 一致
      - name: Publish version release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION_CODE: ${{ steps.version.outputs.code }}
          INSTALL_SET_DIR: ${{ steps.install_sets.outputs.dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(entry/build/default/outputs/default/*.hap libs/*/build/default/outputs/default/*.hsp)
          if [ ${#pkgs[@]} -eq 0 ]; then echo "no .hap/.hsp found"; exit 1; fi

          tag="$GITHUB_REF_NAME"
          ver=$(grep -oP '"versionName"\s*:\s*"\K[^"]+' AppScope/app.json5)
          if [ "$ver" != "$tag" ]; then
            echo "versionName($ver) 与标签($tag) 不一致，请先对齐 AppScope/app.json5"
            exit 1
          fi
          sha7=${GITHUB_SHA::7}

          assets=()
          for h in "${pkgs[@]}"; do
            base=$(basename "$h")
            dst="$RUNNER_TEMP/${base%.*}-${tag}-vc${BUILD_VERSION_CODE}.${base##*.}"
            cp "$h" "$dst"
            assets+=("$dst")
          done
          for archive in "$INSTALL_SET_DIR"/*.zip; do
            assets+=("$archive")
          done

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "自动构建的**未签名** HAP/HSP（versionName ${ver}，versionCode ${BUILD_VERSION_CODE}，commit \`${sha7}\`）。请下载对应 JRE 的成对 ZIP，用同一证书/Profile 签名后按 **HAP → HSP** 顺序安装；不要混用其他构建的模块。"
